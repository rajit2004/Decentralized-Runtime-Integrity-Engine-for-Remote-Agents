name: CI

# Runs on every commit/PR. Gates: compile, Java 17 compatibility, SelfTest
# attack table, dashboard JS syntax, LF portability, live smoke test
# (fresh workspace boots GREEN, then tamper->RED->restore->GREEN), contract build,
# chain e2e (hardhat node -> deploy -> Enroller pins -> GREEN + chainUp + readback=ok
# -> tamper RED -> restore GREEN -> wrong-contract pin refuses chain mode).
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile (JDK only, no build tool)
        run: javac -d out $(find java/src -name "*.java")

      - name: Java 17 compatibility gate
        run: javac --release 17 -d out17 $(find java/src -name "*.java")

      - name: "SelfTest (76 checks - attack table, crypto, Merkle, ABI, key pin, witness, receipt, cursor, chain readback, chain pin)"
        run: |
          set -euo pipefail
          java -cp out integrity.test.SelfTest | tee selftest.out
          n=$(grep -oE '\([0-9]+ checks\)' selftest.out | grep -oE '[0-9]+')
          echo "reported checks: $n"
          grep -q "Tests-${n}_checks" README.md || { echo "README badge says something other than ${n} checks"; exit 1; }
          grep -q "SelfTest - ${n} checks" README.md || { echo "README SelfTest heading mismatch (${n})"; exit 1; }
          grep -qF "SelfTest\` (${n} checks)" README.md || { echo "README test-table row mismatch (${n})"; exit 1; }
          for c in $(grep -oE '[1-9][0-9]+-check' README.md | grep -oE '^[0-9]+'); do
            [ "$c" = "$n" ] || { echo "README has ${c}-check but SelfTest reports ${n}"; exit 1; }
          done
          grep -q "SelfTest (${n} checks" .github/workflows/ci.yml || { echo "ci.yml step name mismatch (${n})"; exit 1; }
          echo "counts consistent"

      - name: Docs hygiene - no em-dashes, no competition framing
        run: |
          set -e
          # ci.yml excluded: it holds the literal patterns (a gate must not match itself).
          if git grep -I -n '—' -- . ':(exclude).github/workflows/ci.yml'; then echo "em-dash found in tracked files"; exit 1; fi
          if git grep -I -n -i -E 'technorazz|hackathon|track 1\.6|judges?|prize|bounty' -- . ':(exclude).github/workflows/ci.yml'; then echo "competition framing found in tracked files"; exit 1; fi
          echo "hygiene clean"

      - name: Dashboard JS syntax
        run: node --check web/app.js

      - name: Hashed files must stay LF (baseline portability gate)
        run: |
          set -e
          out=$(git ls-files --eol java/src/integrity/agent/AgentState.java config/agent-config.json)
          echo "$out"
          count=$(printf '%s\n' "$out" | grep -c '^i/lf')
          if [ "$count" != "2" ]; then echo "hashed file not LF in index"; exit 1; fi
          grep -q 'eol=lf' .gitattributes || { echo ".gitattributes eol=lf pin missing"; exit 1; }

      - name: Smoke test - fresh checkout boots GREEN
        run: |
          set -e
          pkill -f integrity.Main || true
          java -cp out integrity.Main > engine.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 25); do
            sleep 1
            if curl -sf http://localhost:8080/api/status | grep -q '"state":"GREEN"'; then
              echo "GREEN after ${i}s"; ok=1; break
            fi
          done
          if [ "$ok" != "1" ]; then echo "=== never GREEN ==="; cat engine.log; kill $pid || true; exit 1; fi
          kill $pid || true
          sleep 2

      - name: Live verdict regression - tamper RED, restore GREEN
        run: |
          set -e
          pkill -f integrity.Main || true
          sleep 1
          java -cp out integrity.Main > engine2.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          sleep 6
          curl -sf http://localhost:8080/api/tamper/config
          echo ""
          status=""
          for i in $(seq 1 12); do
            sleep 1
            status=$(curl -sf http://localhost:8080/api/status || true)
            echo "poll $i: $status"
            if printf '%s' "$status" | grep -q '"state":"RED"'; then break; fi
          done
          printf '%s' "$status" | grep -q '"state":"RED"' || { echo "tamper not caught"; exit 1; }
          printf '%s' "$status" | grep -q 'POLICY_CFG_CHANGED' || { echo "wrong verdict"; exit 1; }
          curl -sf http://localhost:8080/api/restore/config > /dev/null
          status=""
          for i in $(seq 1 12); do
            sleep 1
            status=$(curl -sf http://localhost:8080/api/status || true)
            if printf '%s' "$status" | grep -q '"state":"GREEN"'; then break; fi
          done
          printf '%s' "$status" | grep -q '"state":"GREEN"' || { echo "restore did not recover"; exit 1; }
          echo "verdict regression OK"

      - name: Contract compiles
        working-directory: contract
        run: |
          npm install --no-audit --no-fund
          npx hardhat compile

      - name: Chain e2e - deploy, pin, GREEN + chainUp + readback, tamper, pin refusal
        run: |
          set -e
          pkill -f integrity.Main || true
          pkill -f hardhat || true
          (cd contract && npx hardhat node > node.log 2>&1 &)
          up=0
          for i in $(seq 1 30); do
            sleep 1
            if curl -sf -X POST http://127.0.0.1:8545 -H 'Content-Type: application/json' \
                 -d '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' > /dev/null 2>&1; then up=1; break; fi
          done
          if [ "$up" != "1" ]; then echo "hardhat node not up"; cat contract/node.log || true; exit 1; fi

          (cd contract && npx hardhat run scripts/deploy.js --network localhost)
          test -f config/chain.json || { echo "chain.json missing"; exit 1; }
          grep -q chainId config/chain.json || { echo "chainId not written"; cat config/chain.json; exit 1; }

          java -cp out integrity.enroll.Enroller > enroller.log 2>&1
          grep -q 'CHAIN PINNED' enroller.log || { echo "Enroller did not pin chain"; cat enroller.log; exit 1; }

          java -cp out integrity.Main > engine.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true; pkill -f hardhat || true' EXIT
          status=""
          ok=0
          for i in $(seq 1 30); do
            sleep 1
            status=$(curl -sf http://localhost:8080/api/status || true)
            if printf '%s' "$status" | grep -q '"state":"GREEN"' && printf '%s' "$status" | grep -q '"chainUp":true'; then ok=1; break; fi
          done
          if [ "$ok" != "1" ]; then echo "=== never GREEN+chainUp ==="; echo "$status"; cat engine.log; exit 1; fi
          printf '%s' "$status" | grep -q 'readback=ok' || { echo "readback not ok: $status"; cat engine.log; exit 1; }
          echo "GREEN + chainUp + readback=ok"

          curl -sf http://localhost:8080/api/tamper/config > /dev/null
          red=0
          for i in $(seq 1 12); do
            sleep 1
            status=$(curl -sf http://localhost:8080/api/status || true)
            if printf '%s' "$status" | grep -q '"state":"RED"'; then red=1; break; fi
          done
          if [ "$red" != "1" ]; then echo "tamper not caught on-chain path"; echo "$status"; exit 1; fi
          printf '%s' "$status" | grep -q 'POLICY_CFG_CHANGED' || { echo "wrong verdict: $status"; exit 1; }
          curl -sf http://localhost:8080/api/restore/config > /dev/null
          green=0
          for i in $(seq 1 15); do
            sleep 1
            status=$(curl -sf http://localhost:8080/api/status || true)
            if printf '%s' "$status" | grep -q '"state":"GREEN"'; then green=1; break; fi
          done
          if [ "$green" != "1" ]; then echo "restore did not recover"; echo "$status"; exit 1; fi
          echo "tamper->RED->GREEN with chain up"

          kill $pid 2>/dev/null || true
          sleep 2
          sed -i 's/"chainContract":"0x[0-9a-fA-F]*"/"chainContract":"0x0000000000000000000000000000000000000001"/' config/baseline.json
          java -cp out integrity.Main > engine2.log 2>&1 &
          pid=$!
          refused=0
          for i in $(seq 1 15); do
            sleep 1
            if grep -q 'CHAIN PIN: contract mismatch' engine2.log 2>/dev/null; then refused=1; break; fi
          done
          if [ "$refused" != "1" ]; then echo "pin refusal not logged"; cat engine2.log; exit 1; fi
          pinok=0
          for i in $(seq 1 10); do
            sleep 1
            status=$(curl -sf http://localhost:8080/api/status || true)
            if printf '%s' "$status" | grep -q '"chainUp":false'; then pinok=1; break; fi
          done
          if [ "$pinok" != "1" ]; then echo "refused pin still anchoring: $status"; cat engine2.log; exit 1; fi
          echo "wrong contract pin refused, ledger fallback"
          echo "chain e2e OK"
